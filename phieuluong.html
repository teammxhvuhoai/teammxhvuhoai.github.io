<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tính Thu Nhập Nhiều Tháng</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#eef4ff;
padding:15px;
color:#1e293b;
}

.container{
max-width:700px;
margin:auto;
background:#fff;
padding:18px;
border-radius:18px;
box-shadow:0 5px 20px rgba(0,0,0,0.08);
}

h1{
text-align:center;
color:#2563eb;
margin-bottom:18px;
font-size:24px;
}

.card{
background:#f8fbff;
border:1px solid #dbeafe;
padding:15px;
border-radius:15px;
margin-bottom:15px;
}

.row{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
margin-bottom:12px;
}

label{
display:block;
margin-bottom:6px;
font-weight:bold;
font-size:14px;
}

input,
select,
textarea{
width:100%;
padding:12px;
border-radius:10px;
border:1px solid #cbd5e1;
font-size:15px;
outline:none;
}

textarea{
height:260px;
resize:none;
margin-top:10px;
background:#f8fafc;
}

button{
width:100%;
padding:13px;
border:none;
border-radius:12px;
font-size:15px;
font-weight:bold;
cursor:pointer;
transition:0.2s;
}

.add-btn{
background:#0ea5e9;
color:white;
margin-top:10px;
}

.calc-btn{
background:#2563eb;
color:white;
margin-top:10px;
}

.copy-btn{
background:#16a34a;
color:white;
margin-top:10px;
}

button:hover{
transform:scale(0.98);
}

.month-item{
background:white;
padding:12px;
border-radius:12px;
border:1px solid #dbeafe;
margin-top:10px;
position:relative;
}

.remove-btn{
position:absolute;
top:10px;
right:10px;
background:#ef4444;
color:white;
border:none;
border-radius:8px;
padding:5px 10px;
font-size:12px;
cursor:pointer;
}

.money{
font-size:22px;
font-weight:bold;
color:#16a34a;
margin-top:12px;
text-align:center;
}

.summary{
background:#f8fbff;
padding:15px;
border-radius:14px;
border:1px solid #dbeafe;
margin-top:15px;
}

@media(max-width:600px){

.row{
grid-template-columns:1fr;
}

h1{
font-size:20px;
}

}

</style>
</head>

<body>

<div class="container">

<h1>Tính Thu Nhập Nhiều Tháng</h1>

<div class="card">

<div class="row">

<div>
<label>Giá đô la hiện tại (VNĐ)</label>
<input type="number" id="rate" value="26000">
</div>

<div>
<label>Khấu trừ (%)</label>
<select id="percent">
<option value="35">35%</option>
<option value="40">40%</option>
<option value="45">45%</option>
<option value="50">50%</option>
<option value="55">55%</option>
</select>
</div>

</div>

<button class="add-btn" onclick="addMonth()">
+ Thêm tháng thu nhập
</button>

<div id="monthList"></div>

<button class="calc-btn" onclick="calculateSalary()">
Tính bảng lương
</button>

</div>

<div class="summary">

<label>Phiếu lương</label>

<textarea id="salaryText" readonly></textarea>

<div class="money" id="finalMoney">
0 VNĐ
</div>

<button class="copy-btn" onclick="copySalary()">
Copy bảng lương
</button>

</div>

</div>

<script>

let monthCount = 0;

// FORMAT

function formatMoney(num){

return Number(num).toLocaleString("vi-VN");

}

// THÊM THÁNG

function addMonth(){

monthCount++;

let div = document.createElement("div");

div.className = "month-item";

div.id = "monthItem"+monthCount;

div.innerHTML = `

<button class="remove-btn"
onclick="removeMonth(${monthCount})">
Xóa
</button>

<div class="row">

<div>
<label>Tháng</label>
<input type="month" class="month-input">
</div>

<div>
<label>Thu nhập đô la ($)</label>
<input type="number"
class="usd-input"
step="0.01"
placeholder="Ví dụ: 1250.75">
</div>

</div>

`;

document.getElementById("monthList")
.appendChild(div);

}

// XÓA THÁNG

function removeMonth(id){

let el = document.getElementById("monthItem"+id);

if(el){
el.remove();
}

}

// TÍNH

function calculateSalary(){

let rate = parseFloat(
document.getElementById("rate").value
) || 0;

let percent = parseFloat(
document.getElementById("percent").value
);

let monthInputs = document.querySelectorAll(".month-input");

let usdInputs = document.querySelectorAll(".usd-input");

if(monthInputs.length === 0){

alert("Vui lòng thêm tháng thu nhập");

return;

}

let totalUsd = 0;

let details = "";

for(let i=0;i<monthInputs.length;i++){

let month = monthInputs[i].value;

let usd = parseFloat(usdInputs[i].value) || 0;

if(month && usd > 0){

let parts = month.split("-");

let year = parts[0];

let m = parts[1];

details +=
"- Tháng "+m+"/"+year+
": $"+formatMoney(usd.toFixed(2))+"\n";

totalUsd += usd;

}

}

if(totalUsd <= 0){

alert("Chưa có dữ liệu thu nhập");

return;

}

// KHẤU TRỪ

let deductUsd = totalUsd * (percent/100);

let receiveUsd = totalUsd - deductUsd;

let receiveVnd = receiveUsd * rate;

// TEXT

let text =

"=========== PHIẾU LƯƠNG ===========\n\n"+

"DANH SÁCH THU NHẬP:\n\n"+

details+

"\n-----------------------------------\n\n"+

"Tổng đô la kiếm được: $"+
formatMoney(totalUsd.toFixed(2))+"\n\n"+

"Giá đô la hiện tại: "+
formatMoney(rate)+" VNĐ\n\n"+

"Khấu trừ: "+percent+"%\n\n"+

"Thu nhập nhận được: "+
(100-percent)+"%\n\n"+

"Tổng khấu trừ: $"+
formatMoney(deductUsd.toFixed(2))+"\n\n"+

"Thực lĩnh USD: $"+
formatMoney(receiveUsd.toFixed(2))+"\n\n"+

"Thực lĩnh VNĐ: "+
formatMoney(receiveVnd.toFixed(0))+
" VNĐ\n\n"+

"Ngày tạo phiếu: "+
new Date().toLocaleDateString("vi-VN");

// HIỂN THỊ

document.getElementById("salaryText")
.value = text;

document.getElementById("finalMoney")
.innerText =
formatMoney(receiveVnd.toFixed(0))+
" VNĐ";

}

// COPY

function copySalary(){

let text = document
.getElementById("salaryText")
.value;

if(!text){

alert("Chưa có bảng lương");

return;

}

navigator.clipboard.writeText(text);

alert("Đã copy bảng lương");

}

// AUTO ADD 1 THÁNG

addMonth();

</script>

</body>
</html>
