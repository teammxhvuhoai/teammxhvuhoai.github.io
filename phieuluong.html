<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Tính Thu Nhập Tháng</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#eef5ff;
padding:15px;
color:#1e293b;
}

.container{
max-width:600px;
margin:auto;
background:#ffffff;
padding:18px;
border-radius:18px;
box-shadow:0 5px 20px rgba(0,0,0,0.08);
}

h1{
text-align:center;
font-size:24px;
margin-bottom:18px;
color:#2563eb;
}

.card{
background:#f8fbff;
padding:15px;
border-radius:14px;
margin-bottom:15px;
border:1px solid #dbeafe;
}

label{
display:block;
margin-bottom:6px;
font-weight:bold;
font-size:14px;
}

input,
select,
textarea{
width:100%;
padding:12px;
border-radius:10px;
border:1px solid #cbd5e1;
font-size:15px;
outline:none;
}

input:focus,
select:focus,
textarea:focus{
border-color:#3b82f6;
}

textarea{
height:240px;
resize:none;
margin-top:10px;
background:#f8fafc;
}

.row{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
}

button{
width:100%;
padding:14px;
border:none;
border-radius:12px;
font-size:15px;
font-weight:bold;
cursor:pointer;
margin-top:12px;
transition:0.2s;
}

.calc-btn{
background:#2563eb;
color:white;
}

.copy-btn{
background:#16a34a;
color:white;
}

button:hover{
transform:scale(0.98);
}

.result-box{
background:#f8fbff;
border:1px solid #dbeafe;
padding:15px;
border-radius:14px;
margin-top:15px;
}

.money{
font-size:22px;
font-weight:bold;
color:#16a34a;
margin-top:10px;
}

.note{
margin-top:10px;
font-size:13px;
color:#64748b;
text-align:center;
}

@media(max-width:600px){

.row{
grid-template-columns:1fr;
}

h1{
font-size:21px;
}

}

</style>
</head>

<body>

<div class="container">

<h1>Tính Thu Nhập Tháng</h1>

<div class="card">

<div class="row">

<div>
<label>Chọn tháng</label>
<input type="month" id="month">
</div>

<div>
<label>Giá đô la (VNĐ)</label>
<input type="number" id="rate" value="26000">
</div>

</div>

<div class="row" style="margin-top:12px;">

<div>
<label>Tổng đô la kiếm được ($)</label>
<input type="number" id="usd" placeholder="Ví dụ: 2500">
</div>

<div>
<label>Khấu trừ (%)</label>
<select id="percent">
<option value="35">35%</option>
<option value="40">40%</option>
<option value="45">45%</option>
<option value="50">50%</option>
<option value="55">55%</option>
</select>
</div>

</div>

<button class="calc-btn" onclick="calculateSalary()">
Tính bảng lương
</button>

</div>

<div class="result-box">

<label>Phiếu lương chi tiết</label>

<textarea id="salaryText" readonly></textarea>

<div class="money" id="finalMoney">
0 VNĐ
</div>

<button class="copy-btn" onclick="copySalary()">
Copy bảng lương
</button>

</div>

<div class="note">
Thiết kế tối ưu cho điện thoại • Hỗ trợ copy nhanh bảng lương
</div>

</div>

<script>

// FORMAT TIỀN

function formatMoney(num){

return Number(num).toLocaleString('vi-VN');

}

// TÍNH LƯƠNG

function calculateSalary(){

let monthValue = document.getElementById("month").value;

let usd = parseFloat(document.getElementById("usd").value) || 0;

let rate = parseFloat(document.getElementById("rate").value) || 0;

let percent = parseFloat(document.getElementById("percent").value);

// CHECK

if(!monthValue){

alert("Vui lòng chọn tháng");

return;

}

if(usd <= 0){

alert("Vui lòng nhập thu nhập đô la");

return;

}

// XỬ LÝ THÁNG

let parts = monthValue.split("-");

let year = parts[0];

let month = parts[1];

let nextMonth = parseInt(month) + 1;

let nextYear = year;

if(nextMonth > 12){

nextMonth = 1;

nextYear++;

}

nextMonth = String(nextMonth).padStart(2,"0");

// TÍNH

let deductUsd = usd * (percent / 100);

let receiveUsd = usd - deductUsd;

let receiveVnd = receiveUsd * rate;

// TEXT

let text =
"========== PHIẾU LƯƠNG ==========\n\n"+

"Tổng đô la kiếm được từ ngày 01/"+month+"/"+year+
" tới ngày 01/"+nextMonth+"/"+nextYear+
" là: $"+formatMoney(usd)+"\n\n"+

"Giá đô la hiện tại: "+formatMoney(rate)+" VNĐ\n\n"+

"Khấu trừ: "+percent+"%\n"+

"Thu nhập nhận được: "+(100-percent)+"%\n\n"+

"Tổng khấu trừ: $"+formatMoney(deductUsd.toFixed(2))+"\n\n"+

"Thực lĩnh USD: $"+formatMoney(receiveUsd.toFixed(2))+"\n\n"+

"Thực lĩnh VNĐ: "+formatMoney(receiveVnd.toFixed(0))+" VNĐ\n\n"+

"Ngày tạo phiếu: "+new Date().toLocaleDateString("vi-VN");

// HIỂN THỊ

document.getElementById("salaryText").value = text;

document.getElementById("finalMoney").innerText =
formatMoney(receiveVnd.toFixed(0))+" VNĐ";

}

// COPY

function copySalary(){

let text = document.getElementById("salaryText").value;

if(!text){

alert("Chưa có bảng lương");

return;

}

navigator.clipboard.writeText(text);

alert("Đã copy bảng lương");

}

</script>

</body>
</html>
