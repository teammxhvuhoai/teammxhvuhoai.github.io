<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>Phương Mẩy Shopee Link </title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
    -webkit-tap-highlight-color:transparent;
}

body{
    background:linear-gradient(180deg,#ff6a00,#ff8c42);
    min-height:100vh;
    padding:12px;
    color:white;
}

.container{
    max-width:500px;
    margin:auto;
    background:rgba(255,255,255,0.12);
    border-radius:24px;
    padding:16px;
    backdrop-filter:blur(10px);
}

h1{
    text-align:center;
    margin-bottom:10px;
}

.desc{
    text-align:center;
    font-size:13px;
    margin-bottom:15px;
    line-height:1.5;
}

.toolbar{
    display:flex;
    gap:8px;
    margin-bottom:15px;
}

.toolbar button{
    flex:1;
    border:none;
    background:white;
    color:#ff6a00;
    padding:12px;
    border-radius:14px;
    font-weight:bold;
    cursor:pointer;
}

.grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
}

.copy-btn{
    border:none;
    background:white;
    border-radius:18px;
    padding:12px;
    text-align:left;
    min-height:95px;
    position:relative;
    cursor:pointer;
}

.copy-btn:active{
    transform:scale(0.96);
}

.copy-title{
    color:#ff6a00;
    font-size:13px;
    font-weight:bold;
    margin-bottom:6px;
    line-height:1.4;
}

.copy-link{
    color:#666;
    font-size:10px;
    word-break:break-all;
}

.copied-tag{
    position:absolute;
    top:8px;
    right:8px;
    background:#2ecc71;
    color:white;
    font-size:10px;
    padding:3px 6px;
    border-radius:999px;
    display:none;
}

.copy-btn.copied .copied-tag{
    display:block;
}

.status{
    text-align:center;
    margin:16px 0;
    font-weight:bold;
    min-height:22px;
}

textarea{
    width:100%;
    height:130px;
    border:none;
    border-radius:16px;
    padding:12px;
    font-size:13px;
    resize:none;
    margin-bottom:12px;
    outline:none;
    color:#333;
}

textarea::placeholder{
    color:rgba(0,0,0,0.35);
}

.footer{
    text-align:center;
    font-size:11px;
    margin-top:10px;
    opacity:0.8;
}
</style>
</head>

<body>

<div class="container">

<h1>🚀[Nhã Phương] Shopee</h1>

<p class="desc">
Copy cực nhanh link Shopee cho mobile
</p>

<div class="toolbar">
<button onclick="shuffleLinks()">🔀 Trộn</button>
<button onclick="copyRandom()">🎲Copy Random</button>
<button onclick="generateButtons()">🔄 Làm Mới</button>
</div>

<div class="grid" id="buttonGrid"></div>

<div class="status" id="statusText">
Sẵn sàng copy...
</div>

<textarea
id="linkInput"
placeholder="Tên sản phẩm | https://shopee.vn/abc"
></textarea>

<div class="toolbar">
<button onclick="loadCustomLinks()">
➕ Load Link Mới
</button>
</div>

<div class="footer">
Shopee Link Tool
</div>

</div>

<script>

let links = [
{ title:'Deal Quạt Mini tích hợp sò lạnh', url:'https://s.shopee.vn/9Kf1bX1i4q' },
{ title:'Deal Kệ để xoong nồi nhiều tầng', url:'https://s.shopee.vn/6L1Q2ArYrV' },
{ title:'Voucher Kệ nồi chảo nhà bếp đa năng', url:'https://s.shopee.vn/17MUZuw5s' },
{ title:'Voucher Máy Xay Sinh Tố Cầm Tay Mini', url:'https://s.shopee.vn/5VSJ2jzOIE' },
{ title:'Voucher Máy Xay Cầm Tay Mini JUICER 340ml', url:'https://s.shopee.vn/1Lck589ury' },
{ title:'Voucher Máy Làm Sữa Hạt OSTMARS', url:'https://s.shopee.vn/5q59RTmMjJ' },
{ title:'Voucher Trọn Bộ Nguyên Liệu Làm Slime', url:'https://s.shopee.vn/5fljFEtZ6v' },
{ title:'Voucher Bộ Kit làm Basic Slime Cầu Vồng Pastel 32 Món', url:'https://s.shopee.vn/9pbICvdVuW' },
{ title:'Voucher Máy Làm Kem Mini Gia Đình Royalstar', url:'https://s.shopee.vn/7KtxEPOX0x' },
{ title:'Voucher Quạt Đeo Cổ WIND Không Cánh', url:'https://s.shopee.vn/2VohTcMqBO' },
{ title:'Voucher Quạt Tháp Điều Hòa Thông Minh Levoit Classic Pro 42 Inch', url:'https://s.shopee.vn/W3mSD4GHQ' },
{ title:'Quạt Kẹp Bàn Mini Tích Điện Màn Hình LCD Cảm Ứng', url:'https://s.shopee.vn/gNCeal6mB' },
{ title:'Voucher Quạt Kẹp Tích Điện MILUXURY F054', url:'https://s.shopee.vn/30l7QxQJ3Y' },
{ title:'Voucher Aecooly Quạt Để Bàn Di Động 180° Màn hình LED', url:'https://s.shopee.vn/7AagOaWUjD' },
{ title:'Voucher Quạt Tích Điện Pin Trâu Cỡ Lớn', url:'https://s.shopee.vn/2BC0RSNVzU' },
{ title:'Voucher Quạt Tích Điện Kẹp LOẠI TO JOTARO J28 Pin Siêu Trâu 60Giờ', url:'https://s.shopee.vn/8V63z8yk6X' },
{ title:'Voucher Máy Xông Tinh Dầu Hiệu Ứng Mưa Rơi LED 7 Màu', url:'https://s.shopee.vn/1LctS1GMFz' },
{ title:'Voucher Áo Điều Hòa YAMA JAPAN 18V Áo Bảo Hộ Gắn Quạt Trang Phục Lao Động Làm Mát Cơ Thể Pin 50000mAH', url:'https://s.shopee.vn/9zurlzpzQi' },
{ title:'Voucher Áo Điều Hòa YAMA JAPAN', url:'https://s.shopee.vn/9fI1NP0cJP' },
{ title:'Voucher Áo Điều Hòa 2 Quạt Chống Tia UV Pin 98.000mAh', url:'https://s.shopee.vn/70HGCX4jgz' }
];

const buttonGrid = document.getElementById('buttonGrid');
const statusText = document.getElementById('statusText');

let lastRandomIndex = -1;

function generateButtons(){

    buttonGrid.innerHTML = '';

    links.forEach((item,index)=>{

        const btn = document.createElement('button');

        btn.className = 'copy-btn';

        btn.innerHTML = `
            <div class="copied-tag">
                COPIED
            </div>

            <div class="copy-title">
                ${item.title}
            </div>

            <div class="copy-link">
                ${item.url}
            </div>
        `;

        btn.onclick = () => {
            copyLink(item,btn,index);
        };

        buttonGrid.appendChild(btn);

    });

}

function fallbackCopy(text){

    const textarea = document.createElement('textarea');

    textarea.value = text;

    document.body.appendChild(textarea);

    textarea.select();

    document.execCommand('copy');

    document.body.removeChild(textarea);

}

async function copyLink(item,button){

    const fullText = `${item.title}\n${item.url}`;

    try{

        if(navigator.clipboard){
            await navigator.clipboard.writeText(fullText);
        }else{
            fallbackCopy(fullText);
        }

        showCopied(button,item.title);

    }catch(error){

        fallbackCopy(fullText);

        showCopied(button,item.title);

    }

}

function showCopied(button,title){

    statusText.textContent = `✅ Đã copy: ${title}`;

    if(button){

        button.classList.add('copied');

        setTimeout(()=>{
            button.classList.remove('copied');
        },1200);

    }

}

function shuffleLinks(){

    for(let i = links.length - 1; i > 0; i--){

        const j = Math.floor(Math.random() * (i + 1));

        [links[i],links[j]] = [links[j],links[i]];

    }

    generateButtons();

    statusText.textContent = '🔀 Đã trộn danh sách';

}

function copyRandom(){

    if(links.length === 0) return;

    let randomIndex;

    do{

        randomIndex = Math.floor(
            Math.random() * links.length
        );

    }while(
        links.length > 1 &&
        randomIndex === lastRandomIndex
    );

    lastRandomIndex = randomIndex;

    const item = links[randomIndex];

    copyLink(item,null);

    shuffleLinks();

    statusText.textContent =
    `🎲 Random không trùng: ${item.title}`;

}

function loadCustomLinks(){

    const input = document
        .getElementById('linkInput')
        .value
        .trim();

    if(!input){

        alert('Vui lòng nhập dữ liệu');

        return;

    }

    const rows = input
        .split('\n')
        .filter(row => row.trim() !== '');

    links = rows.map((row,index)=>{

        const parts = row.split('|');

        return {

            title:
                parts[0]?.trim() ||
                `Link ${index + 1}`,

            url:
                parts[1]?.trim() ||
                parts[0]?.trim()

        };

    });

    generateButtons();

    statusText.textContent =
    `🚀 Đã load ${links.length} link mới`;

}

generateButtons();

</script>

</body>
</html>
