<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Tool Copy Nội Dung</title>

<style>

body{
font-family:Arial;
margin:0;
padding:15px;
background:#f0f7ff;
}

.container{
max-width:650px;
margin:auto;
}

h2{
text-align:center;
color:#0a6fd6;
}

.tabs{
display:flex;
gap:5px;
margin-bottom:10px;
}

.tabbtn{
flex:1;
padding:12px;
border:none;
border-radius:8px;
background:#cfd9e6;
font-weight:bold;
cursor:pointer;
}

.tabbtn.active{
background:#2ecc71;
color:white;
}

.tabcontent{
display:none;
}

.tabcontent.active{
display:block;
}

.textbox-wrap{
position:relative;
}

textarea{
width:100%;
height:140px;
padding:12px;
margin-top:8px;
border-radius:10px;
border:1px solid #cfd9e6;
resize:none;
font-size:16px;
box-sizing:border-box;
}

.iconbox{
position:absolute;
top:10px;
right:10px;
display:flex;
gap:5px;
}

.iconbtn{
width:28px;
height:28px;
border:none;
border-radius:6px;
background:#2ecc71;
color:white;
font-size:16px;
cursor:pointer;
}

.dark{
background:#1a1a1a;
color:white;
border:1px solid #333;
}

.grid{
margin-top:12px;
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

button{
padding:14px;
border:none;
border-radius:10px;
font-size:14px;
font-weight:bold;
background:#4da3ff;
color:white;
cursor:pointer;
position:relative;
overflow:hidden;
}

.bluebtn{
background:linear-gradient(135deg,#0d3b66,#5fa8ff);
}

/* ===== TAB 4 PAGE LIST ===== */
#pageList{
display:flex;
flex-direction:column;
gap:12px;
background:none;
padding:0;
}
.groupbox{
background:none;
padding:0;
}
.mail-row{
background:#fff;
border-radius:16px;
padding:14px;
border:1px solid #e8eef7;
box-shadow:0 4px 15px rgba(0,0,0,.06);
transition:.25s;
}
.mail-row:hover{
transform:translateY(-2px);
box-shadow:0 8px 25px rgba(0,0,0,.10);
}
.page-name{
background:linear-gradient(135deg,#1877f2,#00b7ff);
color:#fff;
padding:10px 14px;
border-radius:12px;
font-size:14px;
font-weight:700;
margin-bottom:10px;
display:flex;
align-items:center;
justify-content:space-between;
}

.page-name::before{
content:"📘";
margin-right:8px;
}

.mail-row input{
width:100%;
height:42px;
border:none;
outline:none;
background:#f5f8fc;
border-radius:10px;
padding:0 12px;
margin-top:8px;
font-size:13px;
cursor:pointer;
transition:.2s;
box-sizing:border-box;
}

.mail-row input:hover{
background:#ebf4ff;
}

.mail-row input:active{
transform:scale(.99);
}

.go{
margin-top:10px;
width:auto;
min-width:70px;
height:34px;
padding:0 18px;
float:right;
border:none;
border-radius:10px;
background:linear-gradient(135deg,#00c853,#00a844);
color:#fff;
font-size:12px;
font-weight:700;
cursor:pointer;
transition:.2s;
}
.go:hover{
transform:translateY(-1px);
box-shadow:0 5px 15px rgba(0,200,83,.35);
}
/* NOTIFY */
#notify{
position:fixed;
bottom:20px;
left:50%;
transform:translateX(-50%);
background:#111827;
color:#fff;
padding:10px 18px;
border-radius:12px;
font-size:13px;
font-weight:600;
z-index:9999;
box-shadow:0 5px 20px rgba(0,0,0,.25);
}
/* MOBILE */
@media(max-width:768px){
.mail-row{
padding:12px;
}
.page-name{
font-size:13px;
}
.mail-row input{
font-size:12px;
}
.go{
width:100%;
height:38px;
margin-top:10px;
}
}
  
/* BADGE COPIED */

.copied-badge{
position:absolute;
top:5px;
right:5px;
background:#16a34a;
color:#fff;
font-size:10px;
padding:2px 6px;
border-radius:20px;
font-weight:bold;
opacity:0;
transform:translateY(-5px);
transition:0.25s;
pointer-events:none;
}

button.show-copied .copied-badge{
opacity:1;
transform:translateY(0);
}
/* ===== TAB 2 THU NHẬP ===== */

.salary-container{
padding:5px;
}

.salary-title{
text-align:center;
color:#2563eb;
font-size:22px;
margin-bottom:15px;
}

.salary-card,
.salary-summary{
background:#fff;
padding:16px;
border-radius:18px;
box-shadow:0 4px 15px rgba(0,0,0,.08);
margin-bottom:15px;
}

.salary-row{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
margin-bottom:12px;
}

.salary-container label{
display:block;
font-weight:bold;
font-size:14px;
margin-bottom:6px;
}

.salary-container input,
.salary-container select,
.salary-container textarea{
width:100%;
padding:12px;
border-radius:10px;
border:1px solid #dbeafe;
font-size:15px;
box-sizing:border-box;
}

.salary-container textarea{
height:260px;
resize:none;
background:#f8fafc;
}

.salary-add-btn,
.salary-calc-btn,
.salary-copy-btn{
width:100%;
padding:13px;
border:none;
border-radius:12px;
font-size:15px;
font-weight:bold;
cursor:pointer;
margin-top:10px;
}

.salary-add-btn{
background:#0ea5e9;
color:white;
}

.salary-calc-btn{
background:#2563eb;
color:white;
}

.salary-copy-btn{
background:#16a34a;
color:white;
}

.salary-money{
font-size:24px;
font-weight:bold;
color:#16a34a;
text-align:center;
margin-top:15px;
}

.month-item{
background:#f8fbff;
border:1px solid #dbeafe;
padding:12px;
border-radius:12px;
margin-top:10px;
position:relative;
}

.remove-btn{
position:absolute;
top:10px;
right:10px;
background:#ef4444;
color:#fff;
border:none;
border-radius:8px;
padding:5px 10px;
font-size:12px;
cursor:pointer;
width:auto;
}

@media(max-width:600px){

.salary-row{
grid-template-columns:1fr;
}

.salary-title{
font-size:20px;
}

}
</style>
</head>

<body>

<div class="container">

<h2>Tool Copy Nội Dung</h2>

<div class="tabs">
<button class="tabbtn active" onclick="openTab('tab1',this)">Hastad Nhanh</button>
<button class="tabbtn" onclick="openTab('tab2',this)">Phiếu Lương</button>
<button class="tabbtn" onclick="openTab('tab3',this)">Mail</button>
<button class="tabbtn" onclick="openTab('tab4',this)">Trang Page</button>
</div>

<!-- TAB 1 -->

<div id="tab1" class="tabcontent active">

<div style="margin-bottom:8px;">
<label>
<input type="radio" name="mode" value="single" checked>
1 chuỗi
</label>

<label style="margin-left:15px;">
<input type="radio" name="mode" value="split">
Tách chuỗi
</label>
</div>

<div class="textbox-wrap">

<textarea id="content1" placeholder="Dán:
1. Nội dung 1
2. Nội dung 2
...
10. Nội dung 10"></textarea>

<div class="iconbox">
<button class="iconbtn" onclick="pasteText()">📋</button>
<button class="iconbtn" onclick="clearText()">❌</button>
</div>

</div>

<div class="grid">

<button onclick="copyData('content1','#tintucmxh #mxh #tintuc',1,this)">
1. Tin tức MXH
</button>

<button onclick="copyData('content1','#tinmoimxh #mxh #tintuc',2,this)">
2. Tin Mới
</button>

<button onclick="copyData('content1','#todaynews #mxh #tintuc',3,this)">
3. Today News
</button>

<button onclick="copyData('content1','#cxcn #camxucconnguoi #mxh #tintuc',4,this)">
4. Cảm xúc
</button>

<button onclick="copyData('content1','#TinNgắnMỗiNgày #tinganmoingay #tinngan #tintuc #mxh',5,this)">
5. Tin Ngắn Mỗi Ngày
</button>

<button onclick="tinNong(6,this)">
6. Dòng Tin Tức
</button>

<button class="bluebtn"
onclick="copyData('content1','#tinmoi24h #tinmoinhat24h #tinmoinhat #tintuc #mxh',7,this)">
7. TinMoi24h
</button>

<button class="bluebtn"
onclick="copyData('content1','#tinnhanh #tinnhanh60s #tinnhanh60smxh #tintuc #mxh',8,this)">
8. Tin Nhanh 60s
</button>

<button class="bluebtn"
onclick="copyData('content1','#tinmoimangxahoi #tinmoimxh #tintuc #mxh',9,this)">
9. Tin mới MXH
</button>

<button class="bluebtn"
onclick="copyData('content1','#tinviet #tintuc',10,this)">
10. Tin Việt
</button>

</div>
</div>

<!-- TAB 2 -->

<div id="tab2" class="tabcontent">

<div class="salary-container">

<h3 class="salary-title">
💰 Tính Thu Nhập Nhiều Tháng
</h3>

<div class="salary-card">

<div class="salary-row">

<div>
<label>Giá đô hiện tại (VNĐ)</label>
<input type="number" id="rate" value="26000">
</div>

<div>
<label>Khấu trừ (%)</label>
<select id="percent">
<option value="35">35%</option>
<option value="40">40%</option>
<option value="45">45%</option>
<option value="50">50%</option>
<option value="55">55%</option>
</select>
</div>

</div>

<button class="salary-add-btn"
onclick="addMonth()">
➕ Thêm tháng thu nhập
</button>

<div id="monthList"></div>

<button class="salary-calc-btn"
onclick="calculateSalary()">
📊 Tính bảng lương
</button>

</div>

<div class="salary-summary">

<label>Phiếu lương</label>

<textarea
id="salaryText"
readonly
placeholder="Kết quả sẽ hiển thị tại đây..."
></textarea>

<div class="salary-money"
id="finalMoney">
0 VNĐ
</div>

<button class="salary-copy-btn"
onclick="copySalary()">
📋 Copy bảng lương
</button>

</div>

</div>

</div>
<!-- TAB 3 -->

<div id="tab3" class="tabcontent">

<div class="mail-row">
<input value="https://mail.tm/" readonly>
<button onclick="window.open('https://mail.tm/')">Mở</button>
</div>

<div class="mail-row">
<input value="https://gmail.com" readonly>
<button onclick="window.open('https://gmail.com')">Mở</button>
</div>

</div>

<!-- TAB 4 -->

<div id="tab4" class="tabcontent">
<div class="groupbox" id="pageList"></div>
</div>

<div id="notify"></div>

</div>

<script>
// DATA PAGE (ĐẦY ĐỦ)
let pages = [
{ name:"Nhã Phương", link:"https://www.facebook.com/nhaphuong.ngo.5", id:"100004332338217"},
{ name:"Công râu", link:"https://www.facebook.com/cong.nguyen.616292", id:"100004430763279"},
{ name:"PIC Chính Tin Tức MXH", link:"https://www.facebook.com/tintucmxhnews/", id:"100004430763279"},
{ name:"Vivu Đây Đó", link:"https://www.facebook.com/profile.php?id=61553995602045", id:"61553995602045"},
{ name:"vuhoai", link:"https://www.facebook.com/tien.cuaanh/", id:"100007819774236"},
{ name:"Hoài Vũ", link:"https://www.facebook.com/profile.php?id=61583380301803", id:"61583380301803"},

{ name:"Tin Mới-Mạng Xã Hội", link:"https://facebook.com/tinmoi.mxh", id:"10001"},
{ name:"Tin Tức MXH", link:"https://facebook.com/TinTucMXH.Page", id:"10002"},
{ name:"Tin Mới 24h", link:"https://facebook.com/TinMoi24h.Page", id:"10003"},
{ name:"Cảm Xúc Con Người", link:"https://facebook.com/camxucconnguoii", id:"10004"},
{ name:"Today News", link:"https://facebook.com/todaynews8entertainment", id:"10005"},
{ name:"Bac Giang Hiện Tại", link:"https://www.facebook.com/100057402221572", id:"100057402221572"},
{ name:"Heist Anatony", link:"https://www.facebook.com/profile.php?id=61557917230628", id:"10001"},
{ name:"Tin Ngắn Mỗi Ngày", link:"https://www.facebook.com/100089319363865", id:"100089319363865"},
{ name:"Dòng Tin Tức", link:"https://www.facebook.com/cuonglay.page/", id:"10008"},
{ name:"Tin Nhanh 60S", link:"https://www.facebook.com/Tintucnhanh60s/", id:"10008"},
{ name:"Beat Diễn Châu", link:"https://www.facebook.com/profile.php?id=61557917230628", id:"10008"},
{ name:"Review Film", link:"https://www.facebook.com/mephimhaychannel", id:"10008"},
{ name:"Page Video", link:"https://facebook.com/page9", id:"10009"},
{ name:"Mê Film Hay", link:"https://www.facebook.com/mephimhaychannel/", id:"10009"},
{ name:"Rain", link:"https://www.facebook.com/Rain.Bored/", id:"10009"},
{ name:"Page Review", link:"https://facebook.com/page10", id:"10010"}
];

// render page
let container = document.getElementById("pageList");

container.innerHTML = "";

pages.forEach(p => {

let div = document.createElement("div");

div.className = "mail-row";

div.innerHTML = `

<div class="page-name">
📘 ${p.name}
</div>

<input
value="🔗 ${p.link}"
readonly
onclick="copyText('${p.link}')">

<input
value="🆔 ${p.id}"
readonly
onclick="copyText('${p.id}')">

<button
class="go"
onclick="window.open('${p.link}','_blank')">
GO
</button>

<div style="clear:both"></div>

`;

container.appendChild(div);

});

// OPEN TAB

function openTab(id,btn){

document.querySelectorAll(".tabcontent")
.forEach(t=>t.classList.remove("active"));

document.querySelectorAll(".tabbtn")
.forEach(t=>t.classList.remove("active"));

document.getElementById(id)
.classList.add("active");

btn.classList.add("active");

}

// DATE

function today(){

const d = new Date();

return d.getDate()+"/"+
(d.getMonth()+1)+"/"+
d.getFullYear();

}

// MODE

function getMode(){

return document.querySelector(
'input[name="mode"]:checked'
).value;

}

// SPLIT TEXT

function splitText(){

let raw = document
.getElementById("content1")
.value
.trim();

let lines = raw
.split(/\r?\n/)
.map(l=>l.trim())
.filter(l=>l!=='');

let result = [];

lines.forEach(line=>{

let match = line.match(
/^\s*(\d+)\s*\.\s*(.+)$/
);

if(match){
result.push(match[2].trim());
}

});

return result;

}

// SHOW COPIED

function showCopied(button){

if(!button) return;

let badge = button.querySelector(".copied-badge");

if(!badge){

badge = document.createElement("span");

badge.className = "copied-badge";

badge.innerText = "Copied";
button.appendChild(badge);
}
button.classList.add("show-copied");
setTimeout(()=>{
button.classList.remove("show-copied");
},3200);
}
// COPY DATA
function copyData(id,tag,index,button){
let mode = getMode();
// SINGLE
if(mode === "single"){
let text = document.getElementById(id).value;
navigator.clipboard.writeText(
text+
"\n\nNgày đăng: "+
today()+
"\n"+
tag
);
notify("Đã copy");
showCopied(button);
return;
}
// SPLIT
let arr = splitText();
if(arr.length < index){
notify("Thiếu dòng "+index);
return;
}
let text = arr[index-1];
navigator.clipboard.writeText(
text+
"\n\nNgày đăng: "+
today()+
"\n"+
tag
);
notify("Đã copy dòng "+index);
showCopied(button);
}
// TIN NÓNG
function tinNong(index,button){
let mode = getMode();
if(mode === "single"){
let text = document.getElementById("content1").value;
navigator.clipboard.writeText(
"🚨 "+
text+
"#dongtintuc #tintucmxh #tinhomnay #tinnong #mxh"
);
notify("Đã copy Dòng Tin Tức");
showCopied(button);
return;
}
let arr = splitText();
if(arr.length < index){
notify("Thiếu dòng "+index);
return;
}
let text = arr[index-1];
navigator.clipboard.writeText(
"🚨 TIN NÓNG\n\n"+
text+
"\n\n#tinnong #mxh"
);
notify("Đã copy Tin Nóng");
showCopied(button);
}
// COPY PRODUCT
function copyProduct(t,button){
navigator.clipboard.writeText(t);
notify("Đã copy");
showCopied(button);
}
// PASTE
function pasteText(){
navigator.clipboard.readText()
.then(t=>{
document.getElementById("content1").value = t;
});
}
// CLEAR
function clearText(){
document.getElementById("content1").value = "";
}

// COPY INPUT
function copyText(text){
navigator.clipboard.writeText(text);
notify("✅ Đã copy thành công");

}
// NOTIFY
function notify(msg){
document.getElementById("notify").innerText = msg;
setTimeout(()=>{
document.getElementById("notify").innerText = "";
},2000);
}
  // ===== TAB THU NHẬP =====

let monthCount = 0;

function formatMoney(num){
return Number(num).toLocaleString("vi-VN");
}

function addMonth(){

monthCount++;

let div = document.createElement("div");

div.className = "month-item";

div.id = "monthItem"+monthCount;

div.innerHTML = `
<button class="remove-btn"
onclick="removeMonth(${monthCount})">
Xóa
</button>

<div class="salary-row">

<div>
<label>Tháng</label>
<input type="month" class="month-input">
</div>

<div>
<label>Thu nhập ($)</label>
<input
type="number"
step="0.01"
class="usd-input"
placeholder="1250.75">
</div>

</div>
`;

document
.getElementById("monthList")
.appendChild(div);

}

function removeMonth(id){

let el =
document.getElementById(
"monthItem"+id
);

if(el) el.remove();

}

function calculateSalary(){

let rate =
parseFloat(
document.getElementById("rate").value
) || 0;

let percent =
parseFloat(
document.getElementById("percent").value
);

let monthInputs =
document.querySelectorAll(".month-input");

let usdInputs =
document.querySelectorAll(".usd-input");

let totalUsd = 0;

let details = "";

for(let i=0;i<monthInputs.length;i++){

let month = monthInputs[i].value;

let usd =
parseFloat(
usdInputs[i].value
) || 0;

if(month && usd > 0){

let parts = month.split("-");

details +=
"- Tháng "+
parts[1]+"/"+
parts[0]+
": $"+
usd.toFixed(2)+
"\n";

totalUsd += usd;

}

}

if(totalUsd<=0){

notify("Chưa có dữ liệu");

return;

}

let deductUsd =
totalUsd * percent / 100;

let receiveUsd =
totalUsd - deductUsd;

let receiveVnd =
receiveUsd * rate;

let text =

"=========== PHIẾU LƯƠNG ===========\n\n"+

details+

"\nTổng USD: $"+
totalUsd.toFixed(2)+

"\nKhấu trừ: "+
percent+"%"+

"\nThực lĩnh USD: $"+
receiveUsd.toFixed(2)+

"\nThực lĩnh VNĐ: "+
formatMoney(receiveVnd.toFixed(0))+
" VNĐ";

document
.getElementById("salaryText")
.value = text;

document
.getElementById("finalMoney")
.innerText =
formatMoney(receiveVnd.toFixed(0))
+" VNĐ";

}

function copySalary(){

let text =
document.getElementById(
"salaryText"
).value;

if(!text){
notify("Chưa có bảng lương");
return;
}

navigator.clipboard.writeText(text);

notify("Đã copy bảng lương");

}

addMonth();
</script>
</body>
</html>
