<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MXH Tools Pro</title>
<style>
:root{
--primary:#2563eb;--bg:#f1f5f9;--card:#fff;--text:#0f172a;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Segoe UI,sans-serif;background:var(--bg);color:var(--text)}
header{padding:20px;background:linear-gradient(135deg,#2563eb,#60a5fa);color:#fff;text-align:center}
.tabs{display:flex;gap:10px;padding:15px;flex-wrap:wrap;justify-content:center}
.tab-btn{padding:10px 16px;border:none;border-radius:12px;background:#fff;cursor:pointer}
.tab-btn.active{background:var(--primary);color:#fff}
.tab{display:none;padding:20px}
.tab.active{display:block}
.card{max-width:900px;margin:auto;background:#fff;border-radius:20px;padding:20px;box-shadow:0 10px 30px rgba(0,0,0,.08)}
input,textarea{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:10px;margin-top:8px}
button.action{background:var(--primary);color:#fff;border:none;padding:12px 18px;border-radius:10px;margin-top:10px;cursor:pointer}
.file-item{padding:10px;border:1px solid #e2e8f0;border-radius:10px;margin:8px 0}
.dropzone{border:2px dashed #94a3b8;padding:30px;text-align:center;border-radius:14px}
</style>
</head>
<body>

<header>
<h1>MXH Tools Pro</h1>
<p>Affiliate • Tạo Web • Quản Lý File</p>
</header>

<div class="tabs">
<button class="tab-btn active" onclick="openTab('home',this)">Trang Chủ</button>
<button class="tab-btn" onclick="openTab('file',this)">Quản Lý File</button>
</div>

<div id="home" class="tab active">
<div class="card">
<h2>Công cụ mới</h2>
<p>Phiên bản tối ưu giao diện hiện đại.</p>
</div>
</div>

<div id="file" class="tab">
<div class="card">
<h2>Đổi tên file sang .mp4</h2>

<div class="dropzone" id="dropzone">
Kéo thả file vào đây hoặc chọn file
</div>

<input type="file" id="files" multiple>

<div id="list"></div>

<button class="action" onclick="renameFiles()">Đổi tên sang MP4</button>
</div>
</div>

<script>
function openTab(id,btn){
document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
document.querySelectorAll('.tab-btn').forEach(t=>t.classList.remove('active'));
document.getElementById(id).classList.add('active');
btn.classList.add('active');
}

const filesInput=document.getElementById('files');
const list=document.getElementById('list');

filesInput.addEventListener('change',showFiles);

function showFiles(){
list.innerHTML='';
[...filesInput.files].forEach(f=>{
list.innerHTML+=`
<div class="file-item">
<b>${f.name}</b><br>
Dung lượng: ${(f.size/1024/1024).toFixed(2)} MB
</div>`;
});
}

function renameFiles(){
const files=[...filesInput.files];
if(!files.length){alert('Chọn file trước');return;}
files.forEach(file=>{
const name=file.name.replace(/\.[^/.]+$/,'')+'.mp4';
const a=document.createElement('a');
a.href=URL.createObjectURL(file);
a.download=name;
a.click();
});
alert('Hoàn tất đổi tên.');
}

const dz=document.getElementById('dropzone');
dz.addEventListener('dragover',e=>e.preventDefault());
dz.addEventListener('drop',e=>{
e.preventDefault();
filesInput.files=e.dataTransfer.files;
showFiles();
});
</script>
</body>
</html>
