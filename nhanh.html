<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bộ nạp nội dung đa trang</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
  :root{
    --bg-chrome:#34383F;
    --bg-chrome-2:#2B2E34;
    --panel:#3D414A;
    --panel-line:#4B4F58;
    --paper:#F6F5F1;
    --ink:#1D1E22;
    --text:#ECEAE4;
    --text-dim:#A7ABB4;
    --accent:#2F5FFF;
    --accent-2:#E8336D;
    --ok:#37B873;
    --radius:6px;
    --mono: 'IBM Plex Mono', monospace;
    --display: 'Space Grotesk', sans-serif;
    --body: 'Inter', sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg-chrome-2); color:var(--text);
    font-family:var(--body); font-size:14px; overflow:hidden;
  }
  button{font-family:var(--body); cursor:pointer;}
  input,select,textarea{font-family:var(--body);}

  /* ---------- layout ---------- */
  #app{display:grid; grid-template-rows:56px 1fr; height:100vh;}
  header{
    display:flex; align-items:center; gap:16px; padding:0 18px;
    background:var(--bg-chrome); border-bottom:1px solid var(--panel-line);
  }
  header h1{
    font-family:var(--display); font-size:16px; font-weight:700; letter-spacing:.02em; margin:0;
    display:flex; align-items:center; gap:8px;
  }
  header h1 .mark{color:var(--accent-2); font-family:var(--mono); font-size:12px; font-weight:500;}
  .spacer{flex:1;}
  .btn{
    border:1px solid var(--panel-line); background:var(--panel); color:var(--text);
    border-radius:var(--radius); padding:8px 13px; font-size:13px; font-weight:500;
    display:inline-flex; align-items:center; gap:6px; white-space:nowrap;
  }
  .btn:hover{border-color:var(--text-dim);}
  .btn.primary{background:var(--accent); border-color:var(--accent); color:white; font-weight:600;}
  .btn.primary:hover{filter:brightness(1.08);}
  .btn.accent2{background:var(--accent-2); border-color:var(--accent-2); color:white;}
  .btn.ghost{background:transparent;}
  .btn:disabled{opacity:.4; cursor:not-allowed;}
  .btn.sm{padding:5px 9px; font-size:12px;}
  select.chip{
    background:var(--panel); color:var(--text); border:1px solid var(--panel-line);
    border-radius:var(--radius); padding:7px 10px; font-size:13px;
  }

  main{display:grid; grid-template-columns:216px 1fr 296px; min-height:0;}

  /* ---------- sidebar: pages ---------- */
  #pages{
    background:var(--bg-chrome); border-right:1px solid var(--panel-line);
    display:flex; flex-direction:column; min-height:0;
  }
  #pages .head{padding:12px 14px 8px; font-family:var(--mono); font-size:11px; letter-spacing:.08em; color:var(--text-dim); text-transform:uppercase;}
  #pageList{flex:1; overflow-y:auto; padding:0 10px 10px;}
  .pageThumb{
    position:relative; border-radius:var(--radius); overflow:hidden; margin-bottom:10px;
    border:2px solid transparent; cursor:pointer; background:var(--ink);
  }
  .pageThumb.active{border-color:var(--accent-2);}
  .pageThumb canvas{display:block; width:100%; height:auto; background:#111;}
  .pageThumb .tag{
    position:absolute; left:6px; bottom:6px; background:rgba(0,0,0,.6); color:#fff;
    font-family:var(--mono); font-size:10px; padding:2px 6px; border-radius:3px;
  }
  .pageThumb .del{
    position:absolute; right:5px; top:5px; width:18px; height:18px; border-radius:50%;
    background:rgba(0,0,0,.55); color:#fff; border:none; font-size:11px; line-height:18px; text-align:center; padding:0;
  }
  #addPageBtn{margin:0 10px 10px;}

  /* ---------- center: canvas ---------- */
  #stage{display:flex; flex-direction:column; min-height:0; background:var(--bg-chrome-2);}
  #toolbar{
    display:flex; align-items:center; gap:8px; padding:10px 16px; border-bottom:1px solid var(--panel-line);
    background:var(--bg-chrome);
  }
  #toolbar .divider{width:1px; height:22px; background:var(--panel-line); margin:0 4px;}
  #canvasArea{flex:1; display:flex; align-items:center; justify-content:center; padding:24px; min-height:0; position:relative;}
  #canvasWrap{
    position:relative; max-width:100%; max-height:100%;
    box-shadow:0 20px 60px rgba(0,0,0,.5);
  }
  #canvasWrap::before, #canvasWrap::after,
  #canvasWrap .cm2, #canvasWrap .cm3{
    content:""; position:absolute; width:16px; height:16px; pointer-events:none; z-index:5;
  }
  #canvasWrap::before{ /* top-left */
    top:-9px; left:-9px; border-top:2px solid var(--accent-2); border-left:2px solid var(--accent-2);
  }
  #canvasWrap::after{ /* bottom-right */
    bottom:-9px; right:-9px; border-bottom:2px solid var(--accent-2); border-right:2px solid var(--accent-2);
  }
  #pageCanvas{display:block; width:100%; height:100%; background:#fff; border-radius:2px;}
  #zoneLayer{position:absolute; inset:0; cursor:crosshair;}
  .zone{
    position:absolute; border:1.5px dashed rgba(47,95,255,.9); background:rgba(47,95,255,.08);
    cursor:move;
  }
  .zone.video{border-color:rgba(232,51,109,.9); background:rgba(232,51,109,.08);}
  .zone.selected{border-style:solid; box-shadow:0 0 0 2px rgba(255,255,255,.5) inset;}
  .zone .lbl{
    position:absolute; top:-20px; left:-1.5px; font-family:var(--mono); font-size:10px;
    background:var(--ink); color:var(--text); padding:2px 5px; border-radius:3px; white-space:nowrap;
  }
  .zone .handle{
    position:absolute; right:-5px; bottom:-5px; width:11px; height:11px; border-radius:2px;
    background:var(--accent-2); cursor:nwse-resize;
  }
  #dragGhost{position:absolute; border:1.5px dashed var(--accent); background:rgba(47,95,255,.15); pointer-events:none;}

  #status{
    padding:8px 16px; border-top:1px solid var(--panel-line); background:var(--bg-chrome);
    font-family:var(--mono); font-size:11.5px; color:var(--text-dim); min-height:34px; display:flex; align-items:center; gap:10px;
  }
  #status .bar{flex:0 0 140px; height:5px; background:var(--panel-line); border-radius:3px; overflow:hidden; display:none;}
  #status .bar > i{display:block; height:100%; width:0%; background:var(--ok);}

  /* ---------- right: properties ---------- */
  #props{background:var(--bg-chrome); border-left:1px solid var(--panel-line); overflow-y:auto; padding:14px;}
  #props .head{font-family:var(--mono); font-size:11px; letter-spacing:.08em; color:var(--text-dim); text-transform:uppercase; margin-bottom:10px;}
  .field{margin-bottom:12px;}
  .field label{display:block; font-size:11.5px; color:var(--text-dim); margin-bottom:5px;}
  .field input[type=text], .field input[type=number], .field textarea, .field select{
    width:100%; background:var(--panel); border:1px solid var(--panel-line); color:var(--text);
    border-radius:var(--radius); padding:7px 9px; font-size:13px;
  }
  .field textarea{resize:vertical; min-height:58px; line-height:1.4;}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
  .field input[type=color]{width:100%; height:32px; padding:2px; background:var(--panel); border:1px solid var(--panel-line); border-radius:var(--radius);}
  .zoneListItem{
    display:flex; align-items:center; gap:6px; padding:7px 8px; border-radius:var(--radius);
    border:1px solid var(--panel-line); margin-bottom:6px; font-size:12.5px; cursor:pointer;
  }
  .zoneListItem.selected{border-color:var(--accent-2);}
  .zoneListItem .dot{width:7px; height:7px; border-radius:50%; background:var(--accent); flex:none;}
  .zoneListItem.video .dot{background:var(--accent-2);}
  .zoneListItem .nm{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-family:var(--mono);}
  .emptyHint{color:var(--text-dim); font-size:12.5px; line-height:1.6; padding:6px 2px;}
  hr.sep{border:none; border-top:1px solid var(--panel-line); margin:16px 0;}

  /* ---------- modal ---------- */
  .modalOverlay{position:fixed; inset:0; background:rgba(0,0,0,.6); display:flex; align-items:center; justify-content:center; z-index:50;}
  .modal{
    background:var(--bg-chrome); border:1px solid var(--panel-line); border-radius:8px;
    width:520px; max-width:92vw; max-height:84vh; overflow-y:auto; padding:20px;
  }
  .modal h2{font-family:var(--display); font-size:16px; margin:0 0 4px;}
  .modal p.hint{color:var(--text-dim); font-size:12.5px; line-height:1.5; margin:0 0 14px;}
  .modal textarea{width:100%; min-height:110px; background:var(--panel); border:1px solid var(--panel-line); color:var(--text); border-radius:var(--radius); padding:9px; font-family:var(--mono); font-size:12px;}
  .modal .actions{display:flex; justify-content:flex-end; gap:8px; margin-top:16px;}
  table.prev{width:100%; border-collapse:collapse; margin-top:10px; font-size:11.5px;}
  table.prev th, table.prev td{border:1px solid var(--panel-line); padding:4px 6px; text-align:left;}
  table.prev th{color:var(--text-dim); font-weight:500;}
  ::-webkit-scrollbar{width:9px; height:9px;}
  ::-webkit-scrollbar-thumb{background:var(--panel-line); border-radius:5px;}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Nạp nội dung đa trang <span class="mark">// export proof</span></h1>
    <select id="presetSel" class="chip"></select>
    <div class="spacer"></div>
    <button class="btn" id="csvBtn">Nhập text hàng loạt (CSV)</button>
    <button class="btn" id="videoBulkBtn">Gán video hàng loạt</button>
    <button class="btn primary" id="exportAllBtn">Tải tất cả trang</button>
  </header>
  <main>
    <div id="pages">
      <div class="head">Trang thiết kế</div>
      <div id="pageList"></div>
      <label class="btn" id="addPageBtn">+ Thêm trang (ảnh nền)
        <input type="file" id="addPageInput" accept="image/*" multiple style="display:none">
      </label>
    </div>

    <div id="stage">
      <div id="toolbar">
        <button class="btn sm" id="addTextZoneBtn">+ Vùng Text</button>
        <button class="btn sm accent2" id="addVideoZoneBtn">+ Vùng Video</button>
        <div class="divider"></div>
        <button class="btn sm" id="dupZoneBtn">Nhân bản vùng</button>
        <button class="btn sm" id="delZoneBtn">Xoá vùng</button>
        <div class="divider"></div>
        <button class="btn sm" id="dupPageBtn">Nhân bản trang</button>
        <div class="spacer"></div>
        <button class="btn primary sm" id="exportPageBtn">Tải trang này</button>
      </div>
      <div id="canvasArea">
        <div id="canvasWrap">
          <canvas id="pageCanvas"></canvas>
          <div id="zoneLayer"></div>
        </div>
      </div>
      <div id="status"><span id="statusText">Sẵn sàng. Thêm trang để bắt đầu.</span><div class="bar" id="statusBar"><i id="statusBarInner"></i></div></div>
    </div>

    <div id="props">
      <div class="head">Các vùng trong trang</div>
      <div id="zoneList"></div>
      <hr class="sep">
      <div id="propBody"><div class="emptyHint">Chọn một vùng trên canvas, hoặc kéo trên canvas với công cụ "+ Vùng Text" / "+ Vùng Video" để tạo vùng mới.</div></div>
    </div>
  </main>
</div>

<script>
/* ===================== STATE ===================== */
const PRESETS = [
  {id:'p_1080x1350', label:'Dọc 1080×1350 (Feed 4:5)', w:1080, h:1350},
  {id:'p_1080x1080', label:'Vuông 1080×1080', w:1080, h:1080},
  {id:'p_1080x1920', label:'Story/Reels 1080×1920', w:1080, h:1920},
  {id:'p_1920x1080', label:'Ngang 1920×1080', w:1920, h:1080},
  {id:'p_a4', label:'A4 dọc 2480×3508', w:2480, h:3508},
];
let preset = PRESETS[0];
let pages = [];
let currentPageId = null;
let selectedZoneId = null;
let creatingType = null; // 'text' | 'video' | null
let uid = 0;
const nid = p => (p||'id') + '_' + (++uid);

const presetSel = document.getElementById('presetSel');
PRESETS.forEach(p=>{
  const o = document.createElement('option'); o.value=p.id; o.textContent=p.label; presetSel.appendChild(o);
});
presetSel.value = preset.id;
presetSel.onchange = ()=>{ preset = PRESETS.find(p=>p.id===presetSel.value); applyCanvasSize(); renderAll(); };

function currentPage(){ return pages.find(p=>p.id===currentPageId) || null; }
function selectedZone(){ const pg=currentPage(); return pg ? pg.zones.find(z=>z.id===selectedZoneId) : null; }

/* ===================== CANVAS SIZING ===================== */
const wrap = document.getElementById('canvasWrap');
const canvas = document.getElementById('pageCanvas');
const zoneLayer = document.getElementById('zoneLayer');
const ctx = canvas.getContext('2d');

function applyCanvasSize(){
  canvas.width = preset.w; canvas.height = preset.h;
  wrap.style.aspectRatio = preset.w + ' / ' + preset.h;
  const area = document.getElementById('canvasArea');
  const maxW = area.clientWidth - 48, maxH = area.clientHeight - 48;
  if (preset.w/preset.h > maxW/maxH){ wrap.style.width = maxW+'px'; wrap.style.height='auto'; }
  else { wrap.style.height = maxH+'px'; wrap.style.width='auto'; }
}
window.addEventListener('resize', applyCanvasSize);

function drawImageCover(c, img, W, H){
  const scale = Math.max(W/img.width, H/img.height);
  const sw = W/scale, sh = H/scale;
  const sx = (img.width-sw)/2, sy=(img.height-sh)/2;
  c.drawImage(img, sx, sy, sw, sh, 0, 0, W, H);
}

function wrapText(c, text, x, y, maxW, lineH, align){
  const paragraphs = String(text||'').split('\n');
  let cursorY = y;
  paragraphs.forEach(par=>{
    const words = par.split(' ');
    let line = '';
    const lines = [];
    words.forEach(w=>{
      const test = line ? line+' '+w : w;
      if (c.measureText(test).width > maxW && line){ lines.push(line); line = w; }
      else line = test;
    });
    lines.push(line);
    lines.forEach(l=>{
      let lx = x;
      if (align==='center') lx = x + maxW/2;
      else if (align==='right') lx = x + maxW;
      c.fillText(l, lx, cursorY);
      cursorY += lineH;
    });
  });
}

function drawZoneText(c, z, W, H){
  const x=z.x*W, y=z.y*H, w=z.w*W, h=z.h*H;
  c.save();
  if (z.bg){ c.fillStyle = z.bgColor || 'rgba(0,0,0,0.4)'; c.fillRect(x,y,w,h); }
  c.beginPath(); c.rect(x,y,w,h); c.clip();
  c.font = `${z.weight||'400'} ${z.fontSize||48}px ${z.font||'Inter, sans-serif'}`;
  c.fillStyle = z.color || '#111111';
  c.textAlign = z.align || 'left';
  c.textBaseline = 'top';
  const pad = w*0.02;
  wrapText(c, z.text||'', x+pad, y+pad, w-pad*2, (z.fontSize||48)*1.25, z.align||'left');
  c.restore();
}

function drawZoneVideoFrame(c, z, W, H, videoEl){
  const x=z.x*W, y=z.y*H, w=z.w*W, h=z.h*H;
  c.save(); c.beginPath(); c.rect(x,y,w,h); c.clip();
  if (videoEl && videoEl.videoWidth){
    const vW=videoEl.videoWidth, vH=videoEl.videoHeight;
    const scale = Math.max(w/vW, h/vH);
    const sw=w/scale, sh=h/scale, sx=(vW-sw)/2, sy=(vH-sh)/2;
    c.drawImage(videoEl, sx, sy, sw, sh, x, y, w, h);
  } else {
    c.fillStyle = '#20222A'; c.fillRect(x,y,w,h);
    c.fillStyle = '#8A8DFB'; c.font = '500 22px Inter, sans-serif'; c.textAlign='center'; c.textBaseline='middle';
    c.fillText('VIDEO: ' + (z.matchName || z.key), x+w/2, y+h/2);
  }
  c.restore();
}

function renderPreviewCanvas(){
  const pg = currentPage();
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle = '#ffffff'; ctx.fillRect(0,0,canvas.width,canvas.height);
  if (!pg) return;
  if (pg.bgImg) drawImageCover(ctx, pg.bgImg, canvas.width, canvas.height);
  pg.zones.forEach(z=>{
    if (z.type==='text') drawZoneText(ctx, z, canvas.width, canvas.height);
    else drawZoneVideoFrame(ctx, z, canvas.width, canvas.height, z._previewVideoEl);
  });
}

/* ===================== PAGES ===================== */
function addPageFromFile(file){
  const url = URL.createObjectURL(file);
  const img = new Image();
  img.onload = ()=>{
    const pg = { id:nid('page'), name:file.name.replace(/\.[^.]+$/,''), bgImg:img, zones:[] };
    pages.push(pg);
    if (!currentPageId) currentPageId = pg.id;
    renderAll();
  };
  img.src = url;
}
document.getElementById('addPageInput').onchange = (e)=>{
  Array.from(e.target.files).forEach(addPageFromFile);
  e.target.value = '';
};

function renderPageList(){
  const list = document.getElementById('pageList');
  list.innerHTML = '';
  pages.forEach((pg, idx)=>{
    const div = document.createElement('div');
    div.className = 'pageThumb' + (pg.id===currentPageId ? ' active' : '');
    const c = document.createElement('canvas');
    c.width = 160; c.height = Math.round(160 * preset.h/preset.w);
    const tctx = c.getContext('2d');
    tctx.fillStyle='#fff'; tctx.fillRect(0,0,c.width,c.height);
    if (pg.bgImg) drawImageCover(tctx, pg.bgImg, c.width, c.height);
    pg.zones.forEach(z=>{
      tctx.strokeStyle = z.type==='video' ? '#E8336D' : '#2F5FFF';
      tctx.lineWidth = 1.2;
      tctx.strokeRect(z.x*c.width, z.y*c.height, z.w*c.width, z.h*c.height);
    });
    div.appendChild(c);
    const tag = document.createElement('div'); tag.className='tag'; tag.textContent = (idx+1)+'. '+pg.name;
    div.appendChild(tag);
    const del = document.createElement('button'); del.className='del'; del.textContent='×';
    del.onclick = (ev)=>{ ev.stopPropagation(); pages = pages.filter(p=>p.id!==pg.id); if(currentPageId===pg.id) currentPageId = pages[0]?.id || null; renderAll(); };
    div.appendChild(del);
    div.onclick = ()=>{ currentPageId = pg.id; selectedZoneId = null; renderAll(); };
    list.appendChild(div);
  });
}

document.getElementById('dupPageBtn').onclick = ()=>{
  const pg = currentPage(); if (!pg) return;
  const copy = JSON.parse(JSON.stringify(pg.zones.map(z=>({...z, id:nid('zone'), videoURL:undefined, videoFile:undefined, _previewVideoEl:undefined}))));
  const np = { id:nid('page'), name: pg.name+'-copy', bgImg: pg.bgImg, zones: copy };
  pages.splice(pages.indexOf(pg)+1, 0, np);
  currentPageId = np.id; renderAll();
};

/* ===================== ZONES: create / drag / resize ===================== */
document.getElementById('addTextZoneBtn').onclick = ()=>{ creatingType='text'; zoneLayer.style.cursor='crosshair'; };
document.getElementById('addVideoZoneBtn').onclick = ()=>{ creatingType='video'; zoneLayer.style.cursor='crosshair'; };

function pct(e){
  const r = zoneLayer.getBoundingClientRect();
  return { x: Math.min(Math.max((e.clientX-r.left)/r.width,0),1), y: Math.min(Math.max((e.clientY-r.top)/r.height,0),1) };
}

let dragGhostEl = null, dragStart = null;
zoneLayer.addEventListener('mousedown', (e)=>{
  if (!currentPage() || !creatingType) return;
  if (e.target !== zoneLayer) return;
  dragStart = pct(e);
  dragGhostEl = document.createElement('div'); dragGhostEl.id='dragGhost';
  zoneLayer.appendChild(dragGhostEl);
  const move = (ev)=>{
    const p = pct(ev);
    const x=Math.min(p.x,dragStart.x), y=Math.min(p.y,dragStart.y);
    const w=Math.abs(p.x-dragStart.x), h=Math.abs(p.y-dragStart.y);
    dragGhostEl.style.left=(x*100)+'%'; dragGhostEl.style.top=(y*100)+'%';
    dragGhostEl.style.width=(w*100)+'%'; dragGhostEl.style.height=(h*100)+'%';
  };
  const up = (ev)=>{
    document.removeEventListener('mousemove', move); document.removeEventListener('mouseup', up);
    const p = pct(ev);
    let x=Math.min(p.x,dragStart.x), y=Math.min(p.y,dragStart.y);
    let w=Math.abs(p.x-dragStart.x), h=Math.abs(p.y-dragStart.y);
    if (w<0.03) w=0.2; if (h<0.03) h=0.1;
    if (x+w>1) x=1-w; if (y+h>1) y=1-h;
    const pg = currentPage();
    const z = creatingType==='text'
      ? { id:nid('zone'), type:'text', key:'text'+(pg.zones.filter(z=>z.type==='text').length+1), x,y,w,h, text:'Nội dung mẫu', fontSize:56, font:'Inter, sans-serif', weight:'600', color:'#111111', align:'left', bg:false, bgColor:'rgba(0,0,0,0.4)' }
      : { id:nid('zone'), type:'video', key:'video'+(pg.zones.filter(z=>z.type==='video').length+1), x,y,w,h, matchName:'', videoURL:null, videoFile:null };
    pg.zones.push(z);
    selectedZoneId = z.id;
    dragGhostEl.remove(); dragGhostEl=null; creatingType=null; zoneLayer.style.cursor='crosshair';
    renderAll();
  };
  document.addEventListener('mousemove', move); document.addEventListener('mouseup', up);
});

function renderZones(){
  zoneLayer.innerHTML='';
  const pg = currentPage(); if (!pg) return;
  pg.zones.forEach(z=>{
    const el = document.createElement('div');
    el.className = 'zone ' + z.type + (z.id===selectedZoneId ? ' selected':'');
    el.style.left=(z.x*100)+'%'; el.style.top=(z.y*100)+'%'; el.style.width=(z.w*100)+'%'; el.style.height=(z.h*100)+'%';
    const lbl = document.createElement('div'); lbl.className='lbl'; lbl.textContent = z.key; el.appendChild(lbl);
    const handle = document.createElement('div'); handle.className='handle'; el.appendChild(handle);
    el.addEventListener('mousedown', (e)=>{
      e.stopPropagation();
      selectedZoneId = z.id; renderAll();
      if (e.target===handle){
        const startX=e.clientX, startY=e.clientY, sw=z.w, sh=z.h;
        const r = zoneLayer.getBoundingClientRect();
        const move=(ev)=>{
          let nw = sw + (ev.clientX-startX)/r.width;
          let nh = sh + (ev.clientY-startY)/r.height;
          nw = Math.min(Math.max(nw,0.03), 1-z.x); nh = Math.min(Math.max(nh,0.03), 1-z.y);
          z.w=nw; z.h=nh; renderZones();
        };
        const up=()=>{ document.removeEventListener('mousemove',move); document.removeEventListener('mouseup',up); renderPageList(); };
        document.addEventListener('mousemove',move); document.addEventListener('mouseup',up);
      } else {
        const startX=e.clientX, startY=e.clientY, sx=z.x, sy=z.y;
        const r = zoneLayer.getBoundingClientRect();
        const move=(ev)=>{
          let nx = sx + (ev.clientX-startX)/r.width;
          let ny = sy + (ev.clientY-startY)/r.height;
          nx = Math.min(Math.max(nx,0), 1-z.w); ny = Math.min(Math.max(ny,0), 1-z.h);
          z.x=nx; z.y=ny; renderZones();
        };
        const up=()=>{ document.removeEventListener('mousemove',move); document.removeEventListener('mouseup',up); renderPageList(); };
        document.addEventListener('mousemove',move); document.addEventListener('mouseup',up);
      }
    });
    zoneLayer.appendChild(el);
  });
}

document.getElementById('delZoneBtn').onclick = ()=>{
  const pg = currentPage(), z = selectedZone(); if (!pg||!z) return;
  pg.zones = pg.zones.filter(zz=>zz.id!==z.id); selectedZoneId=null; renderAll();
};
document.getElementById('dupZoneBtn').onclick = ()=>{
  const pg = currentPage(), z = selectedZone(); if (!pg||!z) return;
  const copy = {...z, id:nid('zone'), key:z.key+'-copy', x:Math.min(z.x+0.03,1-z.w), y:Math.min(z.y+0.03,1-z.h)};
  pg.zones.push(copy); selectedZoneId = copy.id; renderAll();
};

/* ===================== PROPERTIES PANEL ===================== */
function renderZoneListPanel(){
  const box = document.getElementById('zoneList');
  const pg = currentPage();
  box.innerHTML='';
  if (!pg || pg.zones.length===0){ box.innerHTML = '<div class="emptyHint">Trang này chưa có vùng nào.</div>'; return; }
  pg.zones.forEach(z=>{
    const it = document.createElement('div');
    it.className = 'zoneListItem '+z.type+(z.id===selectedZoneId?' selected':'');
    it.innerHTML = `<span class="dot"></span><span class="nm">${z.key}</span><span style="color:var(--text-dim);font-size:11px">${z.type}</span>`;
    it.onclick = ()=>{ selectedZoneId=z.id; renderAll(); };
    box.appendChild(it);
  });
}

function renderProps(){
  const body = document.getElementById('propBody');
  const z = selectedZone();
  if (!z){ body.innerHTML = '<div class="emptyHint">Chọn một vùng trên canvas, hoặc kéo trên canvas với công cụ "+ Vùng Text" / "+ Vùng Video" để tạo vùng mới.</div>'; return; }
  if (z.type==='text'){
    body.innerHTML = `
      <div class="field"><label>Khoá (dùng để khớp cột CSV)</label><input type="text" id="p_key" value="${z.key}"></div>
      <div class="field"><label>Nội dung</label><textarea id="p_text">${z.text||''}</textarea></div>
      <div class="row2">
        <div class="field"><label>Cỡ chữ</label><input type="number" id="p_fs" value="${z.fontSize}"></div>
        <div class="field"><label>Canh lề</label><select id="p_align">
          <option value="left" ${z.align==='left'?'selected':''}>Trái</option>
          <option value="center" ${z.align==='center'?'selected':''}>Giữa</option>
          <option value="right" ${z.align==='right'?'selected':''}>Phải</option>
        </select></div>
      </div>
      <div class="row2">
        <div class="field"><label>Kiểu chữ</label><select id="p_font">
          <option value="Inter, sans-serif" ${z.font.startsWith('Inter')?'selected':''}>Sans (Inter)</option>
          <option value="Georgia, serif" ${z.font.startsWith('Georgia')?'selected':''}>Serif (Georgia)</option>
          <option value="IBM Plex Mono, monospace" ${z.font.startsWith('IBM')?'selected':''}>Mono</option>
        </select></div>
        <div class="field"><label>Độ đậm</label><select id="p_weight">
          <option value="400" ${z.weight==='400'?'selected':''}>Thường</option>
          <option value="600" ${z.weight==='600'?'selected':''}>Đậm vừa</option>
          <option value="700" ${z.weight==='700'?'selected':''}>Đậm</option>
        </select></div>
      </div>
      <div class="field"><label>Màu chữ</label><input type="color" id="p_color" value="${z.color}"></div>
      <div class="field"><label><input type="checkbox" id="p_bg" ${z.bg?'checked':''} style="width:auto;margin-right:6px;">Nền phủ phía sau chữ</label></div>
    `;
    document.getElementById('p_key').oninput = e=>{ z.key=e.target.value; renderAll(); };
    document.getElementById('p_text').oninput = e=>{ z.text=e.target.value; renderPreviewCanvas(); renderPageList(); };
    document.getElementById('p_fs').oninput = e=>{ z.fontSize=+e.target.value; renderPreviewCanvas(); };
    document.getElementById('p_align').onchange = e=>{ z.align=e.target.value; renderPreviewCanvas(); };
    document.getElementById('p_font').onchange = e=>{ z.font=e.target.value; renderPreviewCanvas(); };
    document.getElementById('p_weight').onchange = e=>{ z.weight=e.target.value; renderPreviewCanvas(); };
    document.getElementById('p_color').oninput = e=>{ z.color=e.target.value; renderPreviewCanvas(); };
    document.getElementById('p_bg').onchange = e=>{ z.bg=e.target.checked; renderPreviewCanvas(); };
  } else {
    body.innerHTML = `
      <div class="field"><label>Khoá / tên khớp file video hàng loạt</label><input type="text" id="p_key" value="${z.key}"></div>
      <div class="field"><label>Trạng thái</label><div style="font-family:var(--mono);font-size:12px;color:${z.videoURL?'var(--ok)':'var(--text-dim)'}">${z.videoURL ? '✓ Đã gán: '+(z.videoFile?.name||'video') : 'Chưa có video'}</div></div>
      <div class="field"><label>Chọn video cho vùng này</label><input type="file" id="p_video" accept="video/*"></div>
      <div class="field"><button class="btn sm" id="p_clearVideo">Gỡ video</button></div>
    `;
    document.getElementById('p_key').oninput = e=>{ z.key=e.target.value; z.matchName=e.target.value; renderAll(); };
    document.getElementById('p_video').onchange = e=>{
      const f = e.target.files[0]; if(!f) return;
      z.videoFile = f; z.videoURL = URL.createObjectURL(f);
      attachPreviewVideo(z);
      renderAll();
    };
    document.getElementById('p_clearVideo').onclick = ()=>{ z.videoFile=null; z.videoURL=null; z._previewVideoEl=null; renderAll(); };
  }
}

function attachPreviewVideo(z){
  const v = document.createElement('video');
  v.src = z.videoURL; v.muted=true; v.loop=true; v.playsInline=true;
  v.addEventListener('loadeddata', ()=>{ v.play().catch(()=>{}); renderPreviewCanvas(); });
  z._previewVideoEl = v;
}
let previewTimer = setInterval(()=>{
  const pg = currentPage(); if (!pg) return;
  if (pg.zones.some(z=>z._previewVideoEl)) renderPreviewCanvas();
}, 120);

/* ===================== BULK CSV (text) ===================== */
document.getElementById('csvBtn').onclick = ()=>{
  openModal(`
    <h2>Nhập text hàng loạt (CSV)</h2>
    <p class="hint">Mỗi cột = một "khoá" vùng text (xem khoá trong bảng thuộc tính). Mỗi dòng dữ liệu ứng với 1 trang, theo đúng thứ tự trang hiện có (${pages.length} trang). Dán CSV bên dưới hoặc tải file lên.</p>
    <input type="file" id="csvFile" accept=".csv,text/csv">
    <textarea id="csvText" placeholder="tieu_de,mo_ta
Trang 1,Xin chào
Trang 2,Nội dung khác"></textarea>
    <div class="actions">
      <button class="btn ghost" data-close>Huỷ</button>
      <button class="btn primary" id="csvApply">Áp dụng</button>
    </div>
  `);
  document.getElementById('csvFile').onchange = (e)=>{
    const f = e.target.files[0]; if(!f) return;
    const r = new FileReader(); r.onload = ()=>{ document.getElementById('csvText').value = r.result; }; r.readAsText(f);
  };
  document.getElementById('csvApply').onclick = ()=>{
    const raw = document.getElementById('csvText').value.trim();
    if (!raw) return closeModal();
    const parsed = Papa.parse(raw, {header:true, skipEmptyLines:true});
    let applied = 0;
    parsed.data.forEach((row, i)=>{
      const pg = pages[i]; if (!pg) return;
      Object.keys(row).forEach(col=>{
        const zone = pg.zones.find(z=>z.type==='text' && z.key.toLowerCase()===col.trim().toLowerCase());
        if (zone){ zone.text = row[col]; applied++; }
      });
    });
    closeModal();
    setStatus(`Đã áp dụng CSV cho ${Math.min(parsed.data.length, pages.length)} trang (${applied} vùng được cập nhật).`);
    renderAll();
  };
};

/* ===================== BULK VIDEO MATCH ===================== */
document.getElementById('videoBulkBtn').onclick = ()=>{
  openModal(`
    <h2>Gán video hàng loạt theo tên file</h2>
    <p class="hint">Đặt "Khoá" của mỗi vùng video (bảng thuộc tính) trùng với tên file video (không cần phần đuôi .mp4). Chọn nhiều file cùng lúc, hệ thống tự khớp vào đúng vùng trên đúng trang.</p>
    <input type="file" id="videoFiles" accept="video/*" multiple>
    <div class="actions">
      <button class="btn ghost" data-close>Huỷ</button>
      <button class="btn primary" id="videoApply">Gán video</button>
    </div>
  `);
  document.getElementById('videoApply').onclick = ()=>{
    const files = Array.from(document.getElementById('videoFiles').files || []);
    let matched = 0;
    files.forEach(f=>{
      const base = f.name.replace(/\.[^.]+$/,'').trim().toLowerCase();
      pages.forEach(pg=>{
        pg.zones.filter(z=>z.type==='video').forEach(z=>{
          const key = (z.matchName || z.key || '').trim().toLowerCase();
          if (key && key===base){
            z.videoFile=f; z.videoURL=URL.createObjectURL(f); attachPreviewVideo(z); matched++;
          }
        });
      });
    });
    closeModal();
    setStatus(`Đã gán ${matched} video theo tên file khớp.`);
    renderAll();
  };
};

function openModal(html){
  const ov = document.createElement('div'); ov.className='modalOverlay'; ov.id='modalOverlay';
  const m = document.createElement('div'); m.className='modal'; m.innerHTML = html;
  ov.appendChild(m); document.body.appendChild(ov);
  ov.addEventListener('click', (e)=>{ if(e.target===ov) closeModal(); });
  m.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeModal);
}
function closeModal(){ document.getElementById('modalOverlay')?.remove(); }

/* ===================== EXPORT ===================== */
function setStatus(text, progress){
  document.getElementById('statusText').textContent = text;
  const bar = document.getElementById('statusBar');
  if (progress===undefined){ bar.style.display='none'; }
  else { bar.style.display='block'; document.getElementById('statusBarInner').style.width=(progress*100)+'%'; }
}
function downloadBlob(blob, filename){
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
}

function renderExportFrame(c, pg, W, H, videoEls){
  c.clearRect(0,0,W,H); c.fillStyle='#fff'; c.fillRect(0,0,W,H);
  if (pg.bgImg) drawImageCover(c, pg.bgImg, W, H);
  pg.zones.forEach(z=>{
    if (z.type==='text') drawZoneText(c, z, W, H);
    else drawZoneVideoFrame(c, z, W, H, videoEls[z.id]);
  });
}

async function exportPageAsImage(pg){
  const off = document.createElement('canvas'); off.width=preset.w; off.height=preset.h;
  const c = off.getContext('2d');
  renderExportFrame(c, pg, preset.w, preset.h, {});
  await new Promise(res=>{
    off.toBlob(blob=>{ downloadBlob(blob, `${pg.name}.png`); res(); }, 'image/png');
  });
}

async function exportPageAsVideo(pg, videoZones){
  setStatus(`Đang chuẩn bị video cho "${pg.name}"...`);
  const off = document.createElement('canvas'); off.width=preset.w; off.height=preset.h;
  const c = off.getContext('2d');
  const videoEls = {};
  await Promise.all(videoZones.map(z=>new Promise(res=>{
    const v = document.createElement('video');
    v.src = z.videoURL; v.muted = true; v.loop = true; v.playsInline = true;
    v.addEventListener('loadedmetadata', ()=>res());
    videoEls[z.id] = v;
  })));
  const durations = videoZones.map(z=>videoEls[z.id].duration).filter(d=>isFinite(d) && d>0);
  const duration = Math.min(Math.max(durations.length ? Math.max(...durations) : 5, 1), 20);

  await Promise.all(Object.values(videoEls).map(v=>v.play().catch(()=>{})));

  const stream = off.captureStream(30);
  // try to carry audio from the first video zone that has an audio track
  try {
    const firstV = Object.values(videoEls)[0];
    const vStream = firstV.captureStream ? firstV.captureStream() : null;
    const audioTrack = vStream && vStream.getAudioTracks()[0];
    if (audioTrack) stream.addTrack(audioTrack);
  } catch(e){}

  const mimeCandidates = ['video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'];
  const mime = mimeCandidates.find(m=>MediaRecorder.isTypeSupported(m)) || 'video/webm';
  const recorder = new MediaRecorder(stream, {mimeType:mime, videoBitsPerSecond:6000000});
  const chunks = [];
  recorder.ondataavailable = e=>{ if(e.data.size) chunks.push(e.data); };

  const done = new Promise(resolve=>{
    recorder.onstop = ()=>{
      const blob = new Blob(chunks, {type:mime});
      downloadBlob(blob, `${pg.name}.webm`);
      Object.values(videoEls).forEach(v=>{ v.pause(); });
      resolve();
    };
  });

  recorder.start();
  const start = performance.now();
  function tick(){
    const elapsed = (performance.now()-start)/1000;
    renderExportFrame(c, pg, preset.w, preset.h, videoEls);
    setStatus(`Đang ghi video "${pg.name}"...`, Math.min(elapsed/duration,1));
    if (elapsed < duration) requestAnimationFrame(tick);
    else recorder.stop();
  }
  requestAnimationFrame(tick);
  await done;
}

async function exportPage(pg){
  const videoZones = pg.zones.filter(z=>z.type==='video' && z.videoURL);
  if (videoZones.length===0) await exportPageAsImage(pg);
  else await exportPageAsVideo(pg, videoZones);
}

document.getElementById('exportPageBtn').onclick = async ()=>{
  const pg = currentPage(); if (!pg) return;
  document.getElementById('exportPageBtn').disabled = true;
  await exportPage(pg);
  setStatus(`Đã tải xong "${pg.name}".`);
  document.getElementById('exportPageBtn').disabled = false;
};

document.getElementById('exportAllBtn').onclick = async ()=>{
  if (!pages.length) return;
  document.getElementById('exportAllBtn').disabled = true;
  for (let i=0;i<pages.length;i++){
    setStatus(`Đang xuất trang ${i+1}/${pages.length}: ${pages[i].name}`);
    await exportPage(pages[i]);
    await new Promise(r=>setTimeout(r,300));
  }
  setStatus(`Hoàn tất — đã tải ${pages.length} trang. (Trình duyệt có thể hỏi cho phép "tải nhiều file", hãy chọn Cho phép.)`);
  document.getElementById('exportAllBtn').disabled = false;
};

/* ===================== RENDER ALL ===================== */
function renderAll(){
  applyCanvasSize();
  renderPageList();
  renderPreviewCanvas();
  renderZones();
  renderZoneListPanel();
  renderProps();
}
applyCanvasSize();
renderAll();
</script>
