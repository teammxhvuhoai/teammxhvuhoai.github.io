<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>[Hồ Hà] Shopee Copy </title>
<!-- Logo Shopee -->
<link rel="icon" type="image/png"
href="https://cdn-icons-png.flaticon.com/512/5968/5968220.png">
    
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
    -webkit-tap-highlight-color:transparent;
}

body{
    background:linear-gradient(180deg,#ff6a00,#ff8c42);
    min-height:100vh;
    padding:12px;
    color:white;
}

.container{
    max-width:500px;
    margin:auto;
    background:rgba(255,255,255,0.12);
    border-radius:24px;
    padding:16px;
    backdrop-filter:blur(10px);
}
h1{
    text-align:center;
    margin-bottom:10px;
    color:#FFD700;
    font-size:28px;
    font-weight:900;
    text-shadow:
        0 0 8px rgba(255,215,0,0.8),
        0 0 18px rgba(255,215,0,0.5);
}
.desc{
    text-align:center;
    font-size:13px;
    margin-bottom:15px;
    line-height:1.5;
}

.toolbar{
    display:flex;
    gap:8px;
    margin-bottom:15px;
}

.toolbar button{
    flex:1;
    border:none;
    background:white;
    color:#ff6a00;
    padding:12px;
    border-radius:14px;
    font-weight:bold;
    cursor:pointer;
}

.grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
}

.copy-btn{
    border:none;
    background:white;
    border-radius:18px;
    padding:12px;
    text-align:left;
    min-height:95px;
    position:relative;
    cursor:pointer;
}

.copy-btn:active{
    transform:scale(0.96);
}

.copy-title{
    color:#ff6a00;
    font-size:13px;
    font-weight:bold;
    margin-bottom:6px;
    line-height:1.4;
}

.copy-link{
    color:#666;
    font-size:10px;
    word-break:break-all;
}

.copied-tag{
    position:absolute;
    top:8px;
    right:8px;
    background:#2ecc71;
    color:white;
    font-size:10px;
    padding:3px 6px;
    border-radius:999px;
    display:none;
}

.copy-btn.copied .copied-tag{
    display:block;
}

.status{
    text-align:center;
    margin:16px 0;
    font-weight:bold;
    min-height:22px;
}

textarea{
    width:100%;
    height:130px;
    border:none;
    border-radius:16px;
    padding:12px;
    font-size:13px;
    resize:none;
    margin-bottom:12px;
    outline:none;
    color:#333;
}

textarea::placeholder{
    color:rgba(0,0,0,0.35);
}

.footer{
    text-align:center;
    font-size:11px;
    margin-top:10px;
    opacity:0.8;
}
</style>
</head>

<body>

<div class="container">

<h1>🚀 [Hồ Hà] Shopee Link</h1>

<p class="desc">
Copy cực nhanh link Shopee cho mobile
</p>

<div class="toolbar">
<button onclick="shuffleLinks()">🔀 Trộn</button>
<button onclick="copyRandom()">🎲 Coppy Random</button>
<button onclick="generateButtons()">🔄 Làm Mới</button>
</div>

<div class="grid" id="buttonGrid"></div>

<div class="status" id="statusText">
Sẵn sàng copy...
</div>

<textarea
id="linkInput"
placeholder="Tên sản phẩm | https://shopee.vn/abc"
></textarea>

<div class="toolbar">
<button onclick="loadCustomLinks()">
➕ Load Link Mới
</button>
</div>

<div class="footer">
Shopee Link Tool
</div>

</div>

<script>

let links = [
{ title:'Deal Áo Khoác Chống Nắng Umi Su Cao Cấp, Áo nữ dày dặn', url:'https://s.shopee.vn/6Ai2o52g3h' },
{ title:'Deal Quạt Hot', url:'https://s.shopee.vn/AUqy7Af2tm' },
{ title:'Voucher Thời Trang Nữ', url:'https://s.shopee.vn/BQloEhujt' },
{ title:'Voucher Son bóng lifter Gloss', url:'https://s.shopee.vn/6VKpMYpN8l' },
{ title:'Voucher Camera giám sát', url:'https://s.shopee.vn/8V5tkKBdX3' },
{ title:'Voucher Thẻ nhớ', url:'https://s.shopee.vn/5L8ryXGhGf' },
{ title:'Voucher Thẻ nhớ 32g/64g', url:'https://s.shopee.vn/3B4NOaFoqW' },
{ title:'Voucher Thiết bị định vị thông minh', url:'https://s.shopee.vn/7AaWA0h2eG' },
{ title:'Voucher Quạt tốc độ gió cao', url:'https://s.shopee.vn/8pik98naPI' },
{ title:'Voucher Máy sấy tóc', url:'https://s.shopee.vn/30kxCSdqv5' },
{ title:'Voucher Camera wwiffi', url:'https://s.shopee.vn/qgTrrsZDR' },
{ title:'Voucher Áo Khoác Chống Nắng Umi Su Cao Cấp', url:'https://s.shopee.vn/6Ai2o52g3h' },
{ title:'Voucher Áo Khoác Chống Nắng Umi Su Cao Cấp, Áo nữ dày dặn', url:'https://s.shopee.vn/6Ai2o52g3h' },
{ title:'Voucher  Áo Thun Cổ Trụ Tàu Ôm Eo Co Dãn 4 Chiều', url:'https://s.shopee.vn/3VhHchEMQa' },
{ title:'Voucher Áo Thun Nữ Ôm Body Co Giãn 4 Chiều', url:'https://s.shopee.vn/1Lcnbprt9E' },
{ title:'Voucher Chăn hè cotton đũi xơ đậu nành mền hè', url:'https://s.shopee.vn/4VZpNFU4RA' },
{ title:'Voucher NÓN BẢO HIỂM ĐẠT CHUẨN', url:'https://s.shopee.vn/9ALeuRmpdV' },
{ title:'Voucher Túi màng bọc thực phẩm chất liệu PE', url:'https://s.shopee.vn/3LNrUlFWCg' },
{ title:'Voucher Cây Lau Nhà Tự Vắt KITIMOP CORAL Mã KTMC-01', url:'https://s.shopee.vn/9zulQoaqNY' },
{ title:'Voucher Áo khoác tập gym yoga nữ, áo khoác chống nắng', url:'https://s.shopee.vn/3qK83uB60W' },
{ title:'Voucher Áo Chống Nắng Cho Bé Vải Thun Lạnh', url:'https://s.shopee.vn/3g0ht2SzLD' },
{ title:'Voucher Giấy vệ sinh treo tường TopGia đa sắc đa năng', url:'https://s.shopee.vn/9Kf4e4cT8I' }
];

const buttonGrid = document.getElementById('buttonGrid');
const statusText = document.getElementById('statusText');

let lastRandomIndex = -1;

function generateButtons(){

    buttonGrid.innerHTML = '';

    links.forEach((item,index)=>{

        const btn = document.createElement('button');

        btn.className = 'copy-btn';

        btn.innerHTML = `
            <div class="copied-tag">
                COPIED
            </div>

            <div class="copy-title">
                ${item.title}
            </div>

            <div class="copy-link">
                ${item.url}
            </div>
        `;

        btn.onclick = () => {
            copyLink(item,btn,index);
        };

        buttonGrid.appendChild(btn);

    });

}

function fallbackCopy(text){

    const textarea = document.createElement('textarea');

    textarea.value = text;

    document.body.appendChild(textarea);

    textarea.select();

    document.execCommand('copy');

    document.body.removeChild(textarea);

}

async function copyLink(item,button){

    const fullText = `${item.title}\n${item.url}`;

    try{

        if(navigator.clipboard){
            await navigator.clipboard.writeText(fullText);
        }else{
            fallbackCopy(fullText);
        }

        showCopied(button,item.title);

    }catch(error){

        fallbackCopy(fullText);

        showCopied(button,item.title);

    }

}

function showCopied(button,title){

    statusText.textContent = `✅ Đã copy: ${title}`;

    if(button){

        button.classList.add('copied');

        setTimeout(()=>{
            button.classList.remove('copied');
        },1200);

    }

}

function shuffleLinks(){

    for(let i = links.length - 1; i > 0; i--){

        const j = Math.floor(Math.random() * (i + 1));

        [links[i],links[j]] = [links[j],links[i]];

    }

    generateButtons();

    statusText.textContent = '🔀 Đã trộn danh sách';

}

function copyRandom(){

    if(links.length === 0) return;

    let randomIndex;

    do{

        randomIndex = Math.floor(
            Math.random() * links.length
        );

    }while(
        links.length > 1 &&
        randomIndex === lastRandomIndex
    );

    lastRandomIndex = randomIndex;

    const item = links[randomIndex];

    copyLink(item,null);

    shuffleLinks();

    statusText.textContent =
    `🎲 Random không trùng: ${item.title}`;

}

function loadCustomLinks(){

    const input = document
        .getElementById('linkInput')
        .value
        .trim();

    if(!input){

        alert('Vui lòng nhập dữ liệu');

        return;

    }

    const rows = input
        .split('\n')
        .filter(row => row.trim() !== '');

    links = rows.map((row,index)=>{

        const parts = row.split('|');

        return {

            title:
                parts[0]?.trim() ||
                `Link ${index + 1}`,

            url:
                parts[1]?.trim() ||
                parts[0]?.trim()

        };

    });

    generateButtons();

    statusText.textContent =
    `🚀 Đã load ${links.length} link mới`;

}

generateButtons();

</script>

</body>
</html>
